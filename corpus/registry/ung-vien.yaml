#
# ⚠️ File này KHÁC van-ban.yaml về mục đích:
#   van-ban.yaml  = 15 slot đã chốt cấu trúc, là corpus prototype thật.
#   ung-vien.yaml = kho ứng viên rộng hơn, chưa ai chọn, chưa ai xác minh.
#
# Tách hai file để buổi làm việc Sprint 0 là việc CHỌN (nhanh, có căn cứ) chứ không phải
# việc NHỚ RA (chậm, dễ sót). docs/14 §7 dùng đúng nguyên tắc này cho golden set: đừng gửi
# form trống rồi chờ.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# NGUỒN VÀ GIỚI HẠN CỦA NÓ
#
# Toàn bộ số hiệu dưới đây tra từ Công báo Chính phủ (congbao.chinhphu.vn) ngày 2026-08-17.
# Công báo là nguồn chính thức cho việc VĂN BẢN ĐÃ ĐƯỢC BAN HÀNH VÀ ĐĂNG CÔNG BÁO.
#
# Công báo KHÔNG phải nguồn cho:
#   · trạng thái hiệu lực hiện tại ở cấp Điều/Khoản  → phải lấy từ vbpl.vn
#   · đồ thị quan hệ sửa đổi đầy đủ                  → sơ đồ Công báo đã chứng minh là thiếu
#                                                       (xem quan-he-sua-doi.yaml, mục phát hiện)
#
# Vì vậy MỌI bản ghi ở đây đều thiếu `trang_thai`, và đó là đúng, không phải sót.
# ─────────────────────────────────────────────────────────────────────────────────────

