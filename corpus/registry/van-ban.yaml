# Registry văn bản lõi — bản máy đọc được của docs/04 §2–3.
#
# ⚠️ ĐỌC TRƯỚC KHI SỬA
#
# docs/04 mở đầu bằng một câu không thương lượng: "BA không có thẩm quyền xác nhận số hiệu
# văn bản, ngày hiệu lực hay trạng thái hiệu lực." File này giữ nguyên ranh giới đó.
#
# Những gì BA đã làm:  điền số hiệu và metadata thu được từ NGUỒN CHÍNH THỨC, ghi rõ nguồn
#                      và ngày tra trong khối `metadata_nguon` của từng bản ghi.
# Những gì BA KHÔNG làm: điền `trang_thai` (trạng thái hiệu lực) và `quan_he_sua_doi`.
#                      Hai thứ đó là của chuyên gia, lấy từ vbpl.vn — xem §5 corpus/README.md.
#
# CODEOWNERS đề xuất: /corpus/registry/  @xnk-expert-team
#
# ─────────────────────────────────────────────────────────────────────────────────────
# TRẠNG THÁI THU THẬP (chi tiết: corpus/README.md §4)
#   de_xuat → da_xac_minh → da_tai → da_doi_chieu
# Chỉ bản ghi từ `da_xac_minh` trở lên mới được tools/corpus/thu_thap.py tải.
# ─────────────────────────────────────────────────────────────────────────────────────

phien_ban: 1
cap_nhat_lan_cuoi: 2026-08-17
nguon_xac_minh_bat_buoc: "https://vbpl.vn"

# Tiêu chí bộ 15 văn bản — docs/04 §1. Script kiem_tra.py đối chiếu với các cờ này.
# ⚠️ `tieu_chi` là ĐÍCH PHẢI ĐẠT, không phải mô tả hiện trạng.
#
# `so_van_ban_muc_tieu: 15` nghĩa là "cần 15 văn bản chốt được số hiệu", không phải "đang
# có 15". Hiện trạng đo bằng `python tools/corpus/kiem_tra.py`, và tại 10/09/2026 là
# **17 bản ghi / 7 chốt được số hiệu / 10 slot mới chỉ có mô tả**.
#
# Ghi rõ ở đây vì review 03/09 đọc con số này thành một lời khẳng định về hiện trạng rồi
# đối chiếu với seed (7 dòng) và kết luận file đang nói dối. Một trường tên là "mục tiêu"
# vẫn bị đọc nhầm nếu không có gì bên cạnh nói hiện trạng là bao nhiêu.
tieu_chi:
  so_van_ban_muc_tieu: 15
  so_cap_sua_doi_toi_thieu: 2
  so_cong_van_toi_thieu: 1
  so_van_ban_scan_toi_da: 3
  tong_so_dieu_toi_thieu: 50

