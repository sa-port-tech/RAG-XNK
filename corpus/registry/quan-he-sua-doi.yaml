# Quan hệ sửa đổi — bản máy đọc được của docs/04 §4.
#
# docs/04 §4 gọi đây là "phần quan trọng nhất của tài liệu này". Lý do: file này nạp thẳng
# vào bảng `sua_doi` (docs/00 §9.4) và là căn cứ để Data Engineer viết test cho hàm
# `hieu_luc_tai_ngay()` — story E2-02, story quan trọng nhất của cả prototype.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# 🔴 QUY TẮC MỘT DÒNG, KHÔNG THƯƠNG LƯỢNG
#
#   `pham_vi_anh_huong` phải liệt kê TỪNG Điều/Khoản cụ thể.
#   Ghi "sửa đổi nhiều điều" là làm hỏng đồ thị hiệu lực, và sai đồ thị hiệu lực là
#   sai vĩnh viễn mọi câu trả lời sau đó (docs/04 §5, docs/10 §1.3).
#
# Cách làm (docs/04 §4): mở văn bản sửa đổi, đọc từng khoản dạng "Sửa đổi, bổ sung Điều X…",
# "Bãi bỏ Khoản Y Điều Z…", ghi lại. Không suy đoán, không tóm tắt.
# ─────────────────────────────────────────────────────────────────────────────────────

