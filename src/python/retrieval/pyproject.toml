# retrieval — embedding, hybrid search BM25 + vector, lọc hiệu lực, rerank.
# Sở hữu quyền ĐỌC `corpus` và ĐỌC-GHI `vector` (ADR-0004).
#
# Công cụ (ruff/mypy/pytest) khai ở ../pyproject.toml, không lặp lại ở đây.

[project]
name = "retrieval"
version = "0.1.0"
description = "Truy xuất — hybrid search với bộ lọc hiệu lực ở tầng SQL"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Khai tường minh dù FastAPI đã kéo theo: kiểu dữ liệu của service phụ thuộc
    # trực tiếp vào pydantic, nên nó là phụ thuộc bậc nhất chứ không phải tình cờ.
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]
