# retrieval — embedding, hybrid search BM25 + vector, lọc hiệu lực, rerank.
# Sở hữu quyền ĐỌC `corpus` và ĐỌC-GHI `vector` (ADR-012).
#
# Công cụ (ruff/mypy/pytest) khai ở ../pyproject.toml, không lặp lại ở đây.

[project]
name = "retrieval"
version = "0.1.0"
description = "Truy xuất — hybrid search với bộ lọc hiệu lực ở tầng SQL"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Khai tường minh dù FastAPI đã kéo theo: kiểu dữ liệu của service phụ thuộc
    # trực tiếp vào pydantic, nên nó là phụ thuộc bậc nhất chứ không phải tình cờ.
    "pydantic>=2.9.0",
    # Đọc trực tiếp schema `corpus` — ngoại lệ có chủ đích của docs/00 §4.4, chốt ở ADR-012.
    # SQLAlchemy Core (không phải ORM): câu SQL viết ra tường minh để bộ lọc tenant nhìn
    # thấy được ngay trong mã, thay vì ẩn sau một lớp sinh truy vấn.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Kiểm token do identity-tenant phát. Bản đối ứng của Xnk.Shared phía .NET — cùng một
    # hợp đồng, hai cài đặt.
    "pyjwt>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]
