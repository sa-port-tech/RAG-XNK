# ci-dotnet — build · unit test · format · phân tích tĩnh (docs/00 §8.3 ④)
#
# Vì sao workflow chạy trên MỌI pull request thay vì dùng `on.pull_request.paths`:
# ruleset trên `main` bắt buộc status check `ci-dotnet` phải xanh. Nếu lọc ở cấp
# `on:`, workflow đơn giản không chạy khi PR không đụng .NET, check không bao giờ
# báo cáo, và PR treo ở trạng thái "Expected — Waiting for status to be reported"
# vĩnh viễn. Cách đúng là workflow luôn chạy, lọc đường dẫn ở cấp job, và job tổng
# hợp `ci-dotnet` luôn báo cáo kết quả.
name: ci-dotnet

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Dò đường dẫn thay đổi
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'src/dotnet/**'
              - '!src/dotnet/Xnk.Web/**'
              - '.github/workflows/ci-dotnet.yml'
              - '.github/quality-gates.yml'
              - '.github/services.json'

      - name: Có mã .NET để build chưa
        id: decide
        run: |
          # Bộ lọc trên gồm cả .github/quality-gates.yml, vì đổi ngưỡng thì phải kiểm
          # tra lại. Nhưng trước story E1-11 thư mục src/dotnet/ còn trống, và khi đó
          # "đổi ngưỡng" không có gì để build — bắt CI đỏ trong tình huống đó là báo
          # động giả, mà báo động giả lặp lại thì người ta sẽ thôi đọc kết quả CI.
          #
          # Phân biệt ba trạng thái, không gộp:
          #   không đụng .NET            → bỏ qua, im lặng
          #   đụng .NET nhưng chưa có mã → bỏ qua, có ghi chú
          #   có mã .NET                 → chạy đầy đủ, thiếu solution là LỖI
          present=$(find src/dotnet -name '*.csproj' -not -path '*/Xnk.Web/*' 2>/dev/null | head -1)

          if [ "${{ steps.filter.outputs.dotnet }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PR không đụng src/dotnet/."
          elif [ -z "$present" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ci-dotnet::Chưa có project .NET nào trong src/dotnet/ (story E1-11 chưa làm) — không có gì để build."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build · test · format
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đọc cấu hình từ quality-gates.yml
        id: gates
        run: |
          python3 -m pip install --quiet pyyaml
          {
            echo "dotnet_version=$(python3 .github/scripts/gates.py get runtimes.dotnet)"
            echo "coverage_min=$(python3 .github/scripts/gates.py get dotnet.coverage_min_line_percent)"
            echo "warnaserror=$(python3 .github/scripts/gates.py get dotnet.warnings_as_errors)"
            echo "enforce_format=$(python3 .github/scripts/gates.py get dotnet.enforce_format)"
            echo "solution=$(python3 .github/scripts/gates.py get solution --file .github/services.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Kiểm tra solution tồn tại
        run: |
          sln="${{ steps.gates.outputs.solution }}"
          if [ ! -f "$sln" ]; then
            echo "::error file=.github/services.json::Không tìm thấy solution '$sln'."
            echo "::error::PR này đụng src/dotnet/ nhưng solution chưa tồn tại. Tạo nó trong story E1-11, hoặc sửa khoá 'solution' trong .github/services.json."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.gates.outputs.dotnet_version }}

      - name: Cache gói NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        # `--locked-mode`: restore ĐỎ nếu packages.lock.json lệch với
        # Directory.Packages.props, thay vì âm thầm cập nhật lock rồi build một đồ thị phụ
        # thuộc khác với đồ thị đã được review. Đây là cái làm cho lock file có tác dụng —
        # không có cờ này thì file lock chỉ là một bản ghi chép.
        #
        # Đổi phiên bản gói ở máy: chạy `dotnet restore` (không cờ) rồi commit lock đã đổi.
        run: dotnet restore "${{ steps.gates.outputs.solution }}" --locked-mode

      - name: Kiểm cấu trúc repo
        # Ba thứ không cổng nào khác bắt được: cổng local trùng nhau, .csproj vắng mặt
        # trong Xnk.sln (build bỏ qua, CI vẫn xanh), và service trỏ vào thư mục không có.
        run: python3 .github/scripts/kiem_cau_truc.py

      - name: Kiểm tra định dạng mã
        if: ${{ steps.gates.outputs.enforce_format == 'true' }}
        run: |
          # --verify-no-changes: không sửa file, chỉ báo lỗi nếu có gì cần sửa.
          dotnet format "${{ steps.gates.outputs.solution }}" --verify-no-changes --no-restore

      - name: Build
        run: |
          args=(--configuration Release --no-restore)
          if [ "${{ steps.gates.outputs.warnaserror }}" = "true" ]; then
            # Bao gồm cả cảnh báo của bộ phân tích tĩnh .NET, không chỉ cảnh báo trình biên dịch.
            args+=(-warnaserror -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest)
          fi
          dotnet build "${{ steps.gates.outputs.solution }}" "${args[@]}"

      - name: Unit test + coverage
        run: |
          dotnet test "${{ steps.gates.outputs.solution }}" \
            --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory artifacts/test \
            --logger "trx;LogFileName=dotnet-tests.trx" \
            --logger "console;verbosity=normal"

      - name: Cổng coverage
        run: |
          python3 .github/scripts/coverage_gate.py \
            --label dotnet \
            --min "${{ steps.gates.outputs.coverage_min }}" \
            'artifacts/test/**/coverage.cobertura.xml'

      - name: Lưu kết quả test
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/test
          retention-days: 14

  tenant-isolation:
    name: Test cách ly tenant (BR-11)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # docs/16 §3 xếp BR-11 là một trong ba required check. Cách ly tenant là ranh giới
    # bảo mật, không phải một tính năng — nên nó chạy trên PostgreSQL thật với pgvector
    # chứ không phải trên in-memory provider, vì bộ lọc tenant nằm ở tầng SQL.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: xnk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XNK_TEST_DATABASE_URL: "postgresql://postgres:ci-only-not-a-secret@localhost:5432/xnk_test"
    steps:
      - uses: actions/checkout@v4

      - name: Đọc cấu hình
        id: gates
        run: |
          python3 -m pip install --quiet pyyaml
          {
            echo "dotnet_version=$(python3 .github/scripts/gates.py get runtimes.dotnet)"
            echo "solution=$(python3 .github/scripts/gates.py get solution --file .github/services.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Kiểm tra solution tồn tại
        run: |
          sln="${{ steps.gates.outputs.solution }}"
          if [ ! -f "$sln" ]; then
            echo "::error file=.github/services.json::Không tìm thấy solution '$sln'."
            echo "::error::Có project .NET trong src/dotnet/ nhưng chưa có solution. Tạo nó, hoặc sửa khoá 'solution' trong .github/services.json."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.gates.outputs.dotnet_version }}

      - name: Chạy nhóm test cách ly tenant
        run: |
          # Ý đồ của cổng, giữ nguyên: "không có test BR-11 nào ở ĐÂU CẢ" phải là ĐỎ,
          # nếu không thì lớp cách ly tenant tự tắt trong im lặng đúng lúc cần nhất.
          #
          # Nhưng KHÔNG dùng TreatNoTestsAsError=true trên cả solution được nữa: cờ đó
          # bắt MỌI assembly test phải có test mang trait, nên project test thứ hai được
          # thêm vào — dù hoàn toàn hợp lệ — cũng làm đỏ cổng. Đó là ý đồ khác hẳn.
          #
          # Cách đúng: chạy trên cả solution, ghi kết quả ra trx, rồi đòi TỔNG số test
          # đã chạy phải > 0. Test BR-11 hỏng vẫn làm đỏ, nhờ chính `dotnet test`.
          #
          # Không đặt LogFileName: bốn assembly cùng ghi một tên thì chúng đè lên nhau,
          # và tổng đếm được sẽ phụ thuộc assembly nào chạy cuối.
          dotnet test "${{ steps.gates.outputs.solution }}" \
            --configuration Release \
            --filter "Category=TenantIsolation" \
            --logger "console;verbosity=normal" \
            --logger "trx" \
            --results-directory artifacts/tenant-isolation \
            -- RunConfiguration.TreatNoTestsAsError=false

      - name: Bảo đảm cổng BR-11 không rỗng
        run: |
          # Script tự đọc trait từ trx, KHÔNG tin vào việc `--filter` ở trên còn nguyên.
          # Xoá dòng --filter đi thì con số này không đổi — đó là điều kiện để cổng này
          # thật sự là cổng, chứ không phải một phép đếm ăn theo một dòng ở chỗ khác.
          tong=$(python3 .github/scripts/dem_test_trx.py artifacts/tenant-isolation TenantIsolationTests)
          echo "Số test mang trait Category=TenantIsolation đã chạy: $tong"

          if [ "$tong" -eq 0 ]; then
            echo "::error::Không có test nào mang trait Category=TenantIsolation trong toàn solution."
            echo "::error::BR-11 là ranh giới bảo mật và là required check (docs/16 §3). Mọi PR .NET phải giữ ít nhất một test như vậy."
            exit 1
          fi

  ci-dotnet:
    # Job tổng hợp — ĐÂY là context được khai báo required trong ruleset.
    # Nó luôn chạy, nên luôn báo cáo, kể cả khi PR không đụng .NET.
    name: ci-dotnet
    needs: [changes, build, tenant-isolation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Tổng hợp kết quả
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::Job thất bại: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          skipped=$(echo "$RESULTS" | jq -r 'to_entries[]
            | select(.value.result == "skipped") | .key' | tr '\n' ' ')
          if [ -n "$skipped" ]; then
            echo "PR không đụng src/dotnet/ — bỏ qua: $skipped"
          fi
          echo "ci-dotnet đạt."
