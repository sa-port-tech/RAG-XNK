# ci-python — ruff · mypy · pytest (docs/00 §8.3 ④)
#
# Ba service Python (ingestion · retrieval · generation) được kiểm tra độc lập nhau
# qua matrix, và mỗi service chỉ chạy khi chính nó bị đụng. Đây là "path filter" ở
# mức chi tiết mà docs/00 §8.3 yêu cầu: sửa `generation` thì không phải chờ test của
# `ingestion`.
#
# Về việc luôn chạy workflow rồi mới lọc: xem ghi chú đầu file ci-dotnet.yml.
name: ci-python

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Dò service bị thay đổi
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.filter.outputs.any }}
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            any:
              - 'src/python/**'
              - '.github/workflows/ci-python.yml'
              - '.github/quality-gates.yml'
              - 'tools/**/*.py'
              # Bộ test của retrieval áp chính db/migrations/*.sql lên một database trống,
              # nên nó cũng là phép kiểm chứng hợp đồng liên ngôn ngữ ở ADR-010. Đổi lược
              # đồ mà không chạy lại nhóm test này là bỏ qua đúng chỗ nó có ích nhất.
              - 'db/migrations/**'
            ingestion:
              - 'src/python/ingestion/**'
            retrieval:
              - 'src/python/retrieval/**'
              - 'db/migrations/**'
            generation:
              - 'src/python/generation/**'
            shared:
              - 'src/python/pyproject.toml'
              - 'src/python/uv.lock'
              - '.github/workflows/ci-python.yml'
            cong_cu:
              - 'tools/**/*.py'
              - 'src/python/pyproject.toml'

      - name: Dựng matrix service
        id: matrix
        env:
          IS_INGESTION: ${{ steps.filter.outputs.ingestion }}
          IS_RETRIEVAL: ${{ steps.filter.outputs.retrieval }}
          IS_GENERATION: ${{ steps.filter.outputs.generation }}
          IS_SHARED: ${{ steps.filter.outputs.shared }}
        run: |
          # Đụng file dùng chung thì phải chạy lại toàn bộ — thay đổi ở pyproject
          # hay lock file ảnh hưởng mọi service.
          if [ "$IS_SHARED" = "true" ]; then
            selected='["ingestion","retrieval","generation"]'
          else
            selected=$(jq -cn \
              --arg ing "$IS_INGESTION" --arg ret "$IS_RETRIEVAL" --arg gen "$IS_GENERATION" \
              '[{n:"ingestion",v:$ing},{n:"retrieval",v:$ret},{n:"generation",v:$gen}]
               | map(select(.v == "true") | .n)')
          fi
          echo "services=$selected" >> "$GITHUB_OUTPUT"
          echo "Service sẽ kiểm tra: $selected"

  quality:
    name: ${{ matrix.service }} · ruff · mypy · pytest
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    # PostgreSQL thật cho bộ test của `retrieval`.
    #
    # Service đó ĐỌC trực tiếp schema `corpus` (ngoại lệ ADR-012) và bộ lọc tenant của nó
    # nằm trong câu SQL. Kiểm bằng SQLite hay một lớp giả sẽ xanh kể cả khi câu SQL sai —
    # cùng lý do mà job `tenant-isolation` bên ci-dotnet cũng dùng PostgreSQL thật.
    #
    # Ảnh phải khớp docker-compose.yml và PostgresFixture: lệch phiên bản là cách tạo ra
    # loại lỗi chỉ đỏ trên CI mà không ai tái hiện được ở máy.
    #
    # Hai service kia không dùng tới, và một container rỗi vài chục giây rẻ hơn nhiều so
    # với việc tách một job riêng chỉ để chạy ba test.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: xnk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Có biến này thì conftest dùng database sẵn có thay vì tự khởi Testcontainers.
      XNK_TEST_DATABASE_URL: "postgresql://postgres:ci-only-not-a-secret@localhost:5432/xnk_test"
    defaults:
      run:
        working-directory: src/python
    steps:
      - uses: actions/checkout@v4

      - name: Đọc cấu hình
        id: gates
        working-directory: .
        run: |
          python3 -m pip install --quiet pyyaml
          {
            echo "python_version=$(python3 .github/scripts/gates.py get runtimes.python)"
            echo "coverage_min=$(python3 .github/scripts/gates.py get python.coverage_min_line_percent)"
            echo "lint=$(python3 .github/scripts/gates.py get python.enforce_lint)"
            echo "format=$(python3 .github/scripts/gates.py get python.enforce_format)"
            echo "types=$(python3 .github/scripts/gates.py get python.enforce_types)"
          } >> "$GITHUB_OUTPUT"

      - name: Kiểm tra thư mục service tồn tại
        working-directory: .
        run: |
          if [ ! -d "src/python/${{ matrix.service }}" ]; then
            echo "::error::Không tìm thấy src/python/${{ matrix.service }} (khai báo trong .github/services.json)."
            exit 1
          fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "src/python/**/pyproject.toml"

      - name: Cài Python và phụ thuộc
        run: |
          uv python install "${{ steps.gates.outputs.python_version }}"
          uv sync --all-extras --dev

      - name: ruff check
        if: ${{ steps.gates.outputs.lint == 'true' }}
        run: uv run ruff check --output-format=github "${{ matrix.service }}"

      - name: ruff format
        if: ${{ steps.gates.outputs.format == 'true' }}
        run: uv run ruff format --check --diff "${{ matrix.service }}"

      - name: mypy
        if: ${{ steps.gates.outputs.types == 'true' }}
        run: uv run mypy "${{ matrix.service }}"

      - name: pytest + coverage
        run: |
          uv run pytest "${{ matrix.service }}" \
            --cov="${{ matrix.service }}" \
            --cov-report=xml:../../artifacts/coverage-${{ matrix.service }}.xml \
            --cov-report=term-missing \
            --junitxml=../../artifacts/pytest-${{ matrix.service }}.xml

      - name: Cổng coverage
        working-directory: .
        run: |
          python3 .github/scripts/coverage_gate.py \
            --label "python/${{ matrix.service }}" \
            --min "${{ steps.gates.outputs.coverage_min }}" \
            'artifacts/coverage-${{ matrix.service }}.xml'

      - name: Lưu kết quả test
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.service }}
          path: artifacts
          retention-days: 14

  cong-cu:
    name: tools · ruff
    needs: changes
    if: ${{ needs.changes.outputs.cong_cu == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "src/python/**/pyproject.toml"

      - name: Cài Python và phụ thuộc
        run: uv sync --all-extras --dev

      # Vì sao có job này: `tools/` nằm NGOÀI ma trận của job `quality` (ma trận đó dựng
      # từ .github/services.json, và tools không phải service). Hệ quả trước đây là hơn
      # một nghìn dòng Python không có cổng nào — trong đó `sinh_seed.py` sinh ra
      # `db/seed/*.sql` và `render_nginx.py` sinh ra cấu hình định tuyến, tức là mã không
      # được kiểm lại đang sinh ra artifact được commit.
      #
      # ⚠️ CHƯA có mypy ở đây. Chạy `mypy tools/` hiện ra 15 lỗi: thiếu tham số kiểu cho
      # generic (`dict` trần), thiếu chú thích kiểu trả về ở hai hàm, và thiếu stub
      # `types-PyYAML`. Đó là việc đo được và có kích thước, không phải việc vô hạn — nhưng
      # nó là một story riêng, không phải một dòng thêm vào PR khung. Ghi ra đây để nó là
      # một lỗ hổng CÓ ĐỊA CHỈ.
      - name: ruff check
        run: uv run ruff check --output-format=github ../../tools

      - name: ruff format
        run: uv run ruff format --check --diff ../../tools

  ci-python:
    # Context được khai báo required trong ruleset. Luôn chạy, luôn báo cáo.
    name: ci-python
    needs: [changes, quality, cong-cu]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Tổng hợp kết quả
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::Job thất bại: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "ci-python đạt."
